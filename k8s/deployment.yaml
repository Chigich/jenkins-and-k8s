apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
	app: my-jenkins-app
  template:
    metadata:
      labels:
        app: my-jenkins-app
    spec:
      containers:
      - name: my-app
        image: chiragchigi/my-app:IMAGE_TAG 
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
 name: my-app-service
spec:
 type: NodePort
 selector:
  app: my-jenkins-app
 ports:
 - port: 3000
   targetPort: 3000
   nodePort: 30080
